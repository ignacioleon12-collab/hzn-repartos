
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HZN Repartos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#2563EB;--blue-d:#1D4ED8;--green:#16A34A;--amber:#D97706;--red:#DC2626;
  --bg:#F0F2F5;--card:#fff;--border:#E5E7EB;--muted:#9CA3AF;--text:#111827;--text2:#6B7280;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:1100px;margin:0 auto;}

/* HEADER */
.hdr{background:var(--blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hdr h1{font-size:17px;font-weight:700}
.hdr-icon{font-size:22px}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px;opacity:.85}
.hdr-btn:hover{opacity:1}

/* TABS */
.tab-bar{background:#fff;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px}
.tab{flex:1;padding:9px 4px;border-radius:8px;border:none;background:var(--bg);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.tab.on{background:var(--blue);color:#fff}

/* CONTENT */
.content{padding:14px;padding-bottom:24px}

/* CARDS */
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.78}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bp{background:var(--blue);color:#fff}
.bg2{background:var(--green);color:#fff}
.br{background:var(--red);color:#fff}
.bo{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.bgh{background:var(--bg);color:var(--text)}
.bam{background:var(--amber);color:#fff}
.bsm{padding:9px 14px;font-size:13px;width:auto}

/* FORMS */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:#fff;color:var(--text);outline:none;transition:.15s;font-family:inherit}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue)}
.fld textarea{resize:vertical;min-height:72px}

/* FERRETERÍA LIST ITEMS */
.fi{background:#fff;border-radius:10px;padding:13px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1.5px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.fi:active{border-color:var(--blue)}
.fi-name{font-weight:600;font-size:15px}
.fi-meta{font-size:13px;color:var(--text2);margin-top:2px}

/* ROUTE ITEMS */
.ri{background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:6px;display:flex;align-items:center;gap:11px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ri-num{width:28px;height:28px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ri-drag{color:var(--muted);cursor:grab;font-size:20px;padding:0 4px}

/* REPARTOS */
.rep-item{background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rep-hdr{display:flex;justify-content:space-between;align-items:center}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.b-activo{background:#D1FAE5;color:#065F46}
.b-completado{background:#E5E7EB;color:var(--text2)}

/* PIPELINE BADGES */
.badge-prospecto{background:#F3F4F6;color:#374151}
.badge-visitado{background:#DBEAFE;color:#1D4ED8}
.badge-interesado{background:#FEF3C7;color:#92400E}
.badge-cliente{background:#D1FAE5;color:#065F46}
.badge-perdido{background:#FEE2E2;color:#991B1B}

/* KPI TILES */
.kpi-row{display:flex;gap:10px;padding:2px 0 12px;min-width:max-content}
.kpi-tile{border-radius:12px;padding:16px 18px;min-width:100px;text-align:center;flex-shrink:0}
.kpi-num{font-size:32px;font-weight:800;line-height:1}
.kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;opacity:.9}

/* ALERT CARD */
.alert-card{background:#FEF3C7;border:1px solid #FDE68A;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.alert-card:active{opacity:.85}

/* ACTIVITY ITEMS */
.act-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}

/* FILTER BAR */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.filter-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* PROGRESS */
.prog{background:var(--border);border-radius:8px;height:8px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:8px;transition:width .3s}

/* FIELD - PARADA */
.par-card{background:#fff;border-radius:16px;padding:22px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.09)}
.par-num{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.par-nombre{font-size:23px;font-weight:800;margin-bottom:8px;line-height:1.2}
.par-dir{font-size:15px;color:var(--text2);margin-bottom:4px}
.par-tel{font-size:15px;color:var(--blue);margin-bottom:4px}
.par-notas-prev{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 12px;font-size:13px;color:#92400E;margin-bottom:14px}
.par-done-banner{border-radius:10px;padding:12px;margin-bottom:14px;text-align:center;font-weight:700;font-size:16px}

/* STOP LIST */
.sl-item{display:flex;align-items:center;gap:11px;padding:12px 13px;background:#fff;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1.5px solid transparent}
.sl-item.current{border-color:var(--blue)}
.sl-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--bg);color:var(--text2)}
.sl-item.done .sl-num{background:var(--green);color:#fff}
.sl-item.current .sl-num{background:var(--blue);color:#fff}
.sl-item.nocon .sl-num{background:var(--red);color:#fff}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);flex-direction:column;gap:12px}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:999;animation:fiu .2s ease;max-width:320px;text-align:center;pointer-events:none}
@keyframes fiu{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 40px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* DESKTOP OVERRIDES */
@media (min-width:768px){
  body{padding-bottom:24px}
  .content{padding:20px 28px 32px}
  .tab-bar{padding:10px 20px;gap:10px}
  .tab{font-size:13px;padding:10px 8px}
  .moverlay{align-items:center}
  .modal{border-radius:16px;max-width:700px;max-height:88vh;padding:28px 28px 36px}
  .kpi-row{min-width:unset;flex-wrap:wrap}
  .kpi-tile{flex:1;min-width:120px}
  .hdr{padding:14px 24px}
  .fi,.rep-item{margin-bottom:9px}
  /* 2-col layout for main admin content */
  .desktop-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .desktop-cols-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
}

/* CHECKBOX */
.chk-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.chk-item:last-child{border-bottom:none}
.chk-item input{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0}

/* SEARCH */
.sbox{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:#fff;outline:none;margin-bottom:11px;font-family:inherit}
.sbox:focus{border-color:var(--blue)}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .eico{font-size:44px;margin-bottom:10px}

/* SETUP & FIELD ENTRY */
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:28px 20px}
.cs-logo{font-size:56px;margin-bottom:14px}
.cs-title{font-size:22px;font-weight:700;margin-bottom:6px}
.cs-sub{font-size:15px;color:var(--text2);margin-bottom:28px;text-align:center;line-height:1.5}

/* FIELD HEADER */
.fhdr{background:#fff;border-bottom:1px solid var(--border);padding:11px 14px;position:sticky;top:0;z-index:100}
.fhdr-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.fhdr-rep{font-size:13px;font-weight:600;color:var(--text2)}
.fhdr-prog{font-size:12px;color:var(--muted)}
.fhdr-list-btn{background:var(--bg);border:none;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px}

/* SECTION DIVIDER */
.sdiv{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

a{color:inherit;text-decoration:none}
.divider{height:1px;background:var(--border);margin:14px 0}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div><div>Cargando...</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
// ── STATE ──────────────────────────────────────────────────
const S = {
  scriptUrl: localStorage.getItem('hzn_url') || 'https://script.google.com/macros/s/AKfycbyFBS6hRwTm6vMBCc0QfA_5QFzkjBov5q6HEdDejTPBq00EctykiIDVhhPFXqUSyJOSSg/exec',
  view: 'loading',        // loading | setup | admin | field-entry | field
  adminTab: 0,            // 0=dashboard 1=ferreterias 2=nuevo-reparto 3=repartos
  ferreterias: [],
  repartos: [],
  dashStats: null,
  // ferreterias tab
  ferFilter: 'todos',
  search: '',
  ferreteriaDetalle: null,
  historialDetalle: null,
  editFerreteria: null,
  // route builder
  pasteText: '',
  routeOrdered: [],
  repNombre: '',
  repFecha: '',
  startPoint: null,
  // edit reparto
  editReparto: null,
  // field
  reparto: null,
  paradaIdx: 0,
  fieldTab: 'parada',
};

// ── API ────────────────────────────────────────────────────
async function apiFetch(action, params = {}) {
  if (!S.scriptUrl) throw new Error('URL de script no configurada');
  const reads = ['getFerreterias','getRepartos','getReparto','getDashboard','getHistorialFerreteria','getParaRevisita'];
  try {
    if (reads.includes(action)) {
      const u = new URL(S.scriptUrl);
      u.searchParams.set('action', action);
      Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, String(v)));
      const r = await fetch(u.toString(), {redirect:'follow'});
      const d = await r.json();
      if (!d.success) throw new Error(d.error || 'Error servidor');
      return d.data;
    } else {
      const r = await fetch(S.scriptUrl, {
        method:'POST', redirect:'follow',
        body: JSON.stringify({action, ...params}),
        headers:{'Content-Type':'text/plain'}
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || 'Error servidor');
      return d.data;
    }
  } catch(e) {
    if (e.message && e.message.includes('fetch')) throw new Error('Sin conexión. Verificá internet y la URL del script.');
    throw e;
  }
}

// ── GOOGLE MAPS ROUTE URL ────────────────────────────────
function buildGoogleMapsUrl(list, startPt) {
  const stops = [];
  if (startPt) stops.push(`${startPt.lat},${startPt.lng}`);
  list.forEach(f => {
    if (f.Lat && f.Lng) {
      stops.push(`${+f.Lat},${+f.Lng}`);
    } else {
      const addr = [f.Dirección||f.direccion||'', f.Localidad||f.localidad||'', 'Buenos Aires', 'Argentina']
        .filter(Boolean).join(', ');
      stops.push(encodeURIComponent(addr));
    }
  });
  if (stops.length < 2) return null;
  return `https://www.google.com/maps/dir/${stops.join('/')}`;
}

function attachSort() {
  const list = document.getElementById('rlist');
  if (!list || !window.Sortable) return;
  Sortable.create(list, {
    animation: 140, handle: '.ri-drag',
    onEnd: () => {
      const ids = [...list.querySelectorAll('.ri')].map(el => el.dataset.id);
      S.routeOrdered = ids.map(id => S.routeOrdered.find(f => f.ID === id));
      list.querySelectorAll('.ri-num').forEach((el,i) => el.textContent = i + 1);
    }
  });
}

// ── TOAST & MODAL ─────────────────────────────────────────
let toastT = null;
function toast(msg, dur=3000) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el?.remove(), dur);
}
function modal(html) {
  document.getElementById('mov')?.remove();
  const ov = document.createElement('div');
  ov.id = 'mov'; ov.className = 'moverlay';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() { document.getElementById('mov')?.remove(); }

// ── UTILS ─────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function empty(ico, txt) {
  return `<div class="empty"><div class="eico">${ico}</div><div>${txt}</div></div>`;
}
function fechaStr(f) {
  try { return new Date(f).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}); }
  catch(e) { return f||''; }
}

function pipelineBadge(estado) {
  const e = estado || 'Prospecto';
  const cls = {
    'Prospecto':'prospecto','Visitado':'visitado','Interesado':'interesado',
    'Cliente':'cliente','Perdido':'perdido'
  }[e] || 'prospecto';
  return `<span class="badge badge-${cls}">${esc(e)}</span>`;
}

function normalizarNombre(s) {
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9\s]/g,'')
    .replace(/\s+/g,' ').trim();
}

function palabrasSignificativas(s) {
  const stop = new Set(['la','el','las','los','de','del','ferreteria','ferreria',
    'y','e','a','en','san','gral','general','norte','sur','este','oeste','centro']);
  return normalizarNombre(s).split(' ').filter(w => (w.length > 2 || /^\d+$/.test(w)) && !stop.has(w));
}

function matchFerreteria(nombre) {
  const palabras = palabrasSignificativas(nombre);
  if (!palabras.length) return null;
  let bestMatch = null, bestScore = 0;
  for (const f of S.ferreterias) {
    const palabrasF = palabrasSignificativas(f.Nombre);
    if (!palabrasF.length) continue;
    const matches = palabras.filter(w =>
      palabrasF.some(wf => wf === w || wf.startsWith(w) || w.startsWith(wf))
    );
    const score = matches.length / Math.max(palabras.length, palabrasF.length);
    if (score >= 0.6 && score > bestScore) {
      bestScore = score;
      bestMatch = f;
    }
  }
  return bestMatch;
}

// ── RENDER MAIN ───────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (S.view === 'loading')      { app.innerHTML = `<div class="loading"><div class="spin"></div><div>Cargando...</div></div>`; return; }
  if (S.view === 'setup')        { app.innerHTML = renderSetup(); return; }
  if (S.view === 'field-entry')  { app.innerHTML = renderFieldEntry(); return; }
  if (S.view === 'field')        { app.innerHTML = renderField(); return; }
  if (S.view === 'admin')        { app.innerHTML = renderAdmin(); }
}

// ════════════════════════════════════════════════════════
// SETUP SCREEN
// ════════════════════════════════════════════════════════
function renderSetup() { return `
<div class="center-screen">
  <div class="cs-logo">🔧</div>
  <div class="cs-title">HZN Repartos</div>
  <div class="cs-sub">Ingresá la URL de tu Google Apps Script para conectar la app con la planilla</div>
  <div class="fld" style="width:100%">
    <label>URL del Apps Script</label>
    <input type="url" id="su" placeholder="https://script.google.com/macros/s/..." value="${esc(S.scriptUrl)}" style="font-size:13px">
  </div>
  <button class="btn bp" onclick="saveSetup()">Conectar →</button>
  <div style="margin-top:20px;font-size:13px;color:var(--muted)">
    <a href="#" onclick="showSetupHelp();return false;" style="color:var(--blue)">¿Cómo configuro el Apps Script?</a>
  </div>
</div>`; }

function saveSetup() {
  const url = document.getElementById('su').value.trim();
  if (!url) { toast('Ingresá la URL'); return; }
  S.scriptUrl = url;
  localStorage.setItem('hzn_url', url);
  loadApp();
}

function showSetupHelp() { modal(`
<div class="modal-title">Configurar Apps Script</div>
<div style="font-size:14px;line-height:1.8;color:var(--text2)">
<strong>1.</strong> Abrí <a href="https://script.google.com" target="_blank" style="color:var(--blue)">script.google.com</a><br>
<strong>2.</strong> Creá nuevo proyecto → pegá el código del archivo <strong>hzn-apps-script.js</strong><br>
<strong>3.</strong> Guardá con Ctrl+S<br>
<strong>4.</strong> Clic en <strong>Ejecutar → initSheets</strong> (esto crea las hojas en tu planilla)<br>
<strong>5.</strong> Clic en <strong>Implementar → Nueva implementación</strong><br>
<strong>6.</strong> Tipo: <em>Aplicación web</em> · Ejecutar como: <em>Yo</em> · Acceso: <em>Cualquier usuario</em><br>
<strong>7.</strong> Autorizá y copiá la URL → pegala acá
</div>
<button class="btn bp" style="margin-top:16px" onclick="closeModal()">Entendido</button>`); }

// ════════════════════════════════════════════════════════
// ADMIN SHELL
// ════════════════════════════════════════════════════════
function renderAdmin() { return `
<div class="hdr">
  <div class="hdr-icon">🔧</div>
  <h1>HZN Repartos</h1>
  <div class="hdr-right">
    <button class="hdr-btn" onclick="showSettings()" title="Configuración">⚙️</button>
    <button class="hdr-btn" onclick="switchToField()" title="Modo repartidor">🚚</button>
  </div>
</div>
<div class="tab-bar">
  ${[['🏠','Inicio'],['🏪','Ferreterías'],['🗺','Reparto'],['📋','Repartos']].map(([ico,lbl],i) => `
  <button class="tab ${S.adminTab===i?'on':''}" onclick="setTab(${i})">${ico} ${lbl}</button>`).join('')}
</div>
<div class="content">
  ${S.adminTab===0 ? renderDashboard()         : ''}
  ${S.adminTab===1 ? renderTabFerreterias()    : ''}
  ${S.adminTab===2 ? renderTabNuevoReparto()   : ''}
  ${S.adminTab===3 ? renderTabRepartos()       : ''}
</div>`; }

function setTab(i) {
  S.adminTab = i;
  if (i !== 1) S.search = '';
  render();
  if (i === 0 && !S.dashStats) {
    loadDashboardStats().then(() => render());
  }
  if (i === 2 && S.routeOrdered.length > 0) setTimeout(() => attachSort(), 150);
}

function showSettings() { modal(`
<div class="modal-title">⚙️ Configuración</div>
<div class="fld"><label>URL del Apps Script</label>
<input id="cfg-url" value="${esc(S.scriptUrl)}" style="font-size:12px"></div>
<button class="btn bp" onclick="saveSettings()">Guardar</button>
<div class="divider"></div>
<button class="btn bgh" onclick="closeModal();switchToField()">📱 Ir al modo repartidor</button>

function filteredFerreterias() {
  let list = S.ferreterias;
  const f  = S.ferFilter;
  if (f === 'prospectos')  list = list.filter(x => !x.Estado || x.Estado === 'Prospecto');
  else if (f === 'interesados') list = list.filter(x => x.Estado === 'Interesado');
  else if (f === 'clientes')    list = list.filter(x => x.Estado === 'Cliente');
  else if (f === 'revisitar') {
    const ids = new Set(S.dashStats?.paraRevisitarIds || []);
    list = list.filter(x => ids.has(String(x.ID)));
  }
  const q = S.search.toLowerCase();
  if (q) list = list.filter(x =>
    (x.Nombre||'').toLowerCase().includes(q) ||
    (x['Dirección']||'').toLowerCase().includes(q) ||
    (x.Localidad||'').toLowerCase().includes(q)
  );
  return list;
}

function renderTabFerreterias() {
  const filters = [
    ['todos','Todos'],['prospectos','Prospectos'],['interesados','Interesados'],
    ['clientes','Clientes'],['revisitar','Revisitar']

  const list = filteredFerreterias();
  return `
<div class="filter-bar">
  ${filters.map(([v,l]) => `
  <button class="filter-btn ${S.ferFilter===v?'on':''}" onclick="S.ferFilter='${v}';renderFList()">${l}</button>`).join('')}
</div>
<input class="sbox" placeholder="🔍 Buscar..." value="${esc(S.search)}" oninput="S.search=this.value;renderFList()">
<button class="btn bp" style="margin-bottom:14px" onclick="openFForm()">+ Agregar ferretería</button>
<div id="flist">${renderFItems(list)}</div>`; }

function parsearYCargar() {
  const txt = (document.getElementById('paste-area')?.value || S.pasteText).trim();
  if (!txt) { toast('Pegá las ferreterías primero'); return; }
  S.pasteText = txt;

  const lineas = txt.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lineas.length) { toast('No hay líneas válidas'); return; }

  const paradas = [];
  for (let i = 0; i < lineas.length; i++) {
    const idx = lineas[i].indexOf(',');
    if (idx < 0) { toast(`Línea ${i+1} sin coma — saltada`); continue; }
    const nombre = lineas[i].slice(0, idx).trim();
    const dir    = lineas[i].slice(idx + 1).trim();

    const matched = matchFerreteria(nombre);
    if (matched) {
      paradas.push({
        ID: matched.ID, Nombre: nombre,
        'Dirección': dir,
        Localidad: '',
        Lat: matched.Lat || '', Lng: matched.Lng || '',
        'Teléfono': matched['Teléfono'] || '',
        Contacto: matched.Contacto || '',
        Notas: matched.Notas || '',
        _esNueva: false, _matchedId: matched.ID
      });
    } else {
      paradas.push({
        ID: 'nueva-' + i, Nombre: nombre,
        'Dirección': dir,
        Localidad: '', Lat: '', Lng: '',
        'Teléfono': '', Contacto: '', Notas: '',
        _esNueva: true, _matchedId: null
      });
    }
  }

  if (!paradas.length) { toast('No se pudieron parsear las líneas'); return; }
  S.routeOrdered = paradas;
  render();
  setTimeout(() => attachSort(), 100);
  const nuevas = paradas.filter(p => p._esNueva).length;
  toast(`${paradas.length} paradas cargadas ✓${nuevas ? ` (${nuevas} nuevas)` : ''}`);
}

function useGPS() {
  if (!navigator.geolocation) { toast('Tu navegador no soporta GPS'); return; }
  toast('Obteniendo ubicación...⏳', 5000);
  navigator.geolocation.getCurrentPosition(
    pos => {
      S.startPoint = {lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'Mi ubicación actual'};
      render(); toast('Punto de partida establecido ✓');
    },
    () => toast('No se pudo obtener la ubicación')
  );
}

async function setStartFromAddress() {
  const dir = document.getElementById('sp-dir').value.trim();
  if (!dir) { toast('Ingresá una dirección'); return; }
  toast('Buscando...', 5000);
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dir+', Buenos Aires, Argentina')}&limit=1&countrycodes=ar`;
    const r = await fetch(url, {headers:{'Accept-Language':'es'}});
    const d = await r.json();
    if (d[0]) {
      S.startPoint = {lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon), label: dir};
      closeModal(); render(); toast('Punto de partida establecido ✓');
    } else toast('No se encontró la dirección');
  } catch(e) { toast('Error buscando dirección'); }
}

async function crearReparto() {
  const nombre = (document.getElementById('rn')?.value || S.repNombre).trim();
  const fecha  = document.getElementById('rf')?.value || S.repFecha;
  if (!nombre)               { toast('Ponele un nombre al reparto'); return; }
  if (!S.routeOrdered.length){ toast('No hay ferreterías en la ruta'); return; }

  toast('Creando reparto...');
  try {
    // 1. Crear ferreterías nuevas primero
    const idMap = {};
    for (const f of S.routeOrdered.filter(x => x._esNueva)) {
      const res = await apiFetch('saveFerreteria', {
        id: '', nombre: f.Nombre, direccion: f['Dirección'] || '',
        localidad: f.Localidad || '', zona: '',
        telefono: f['Teléfono'] || '', contacto: f.Contacto || '',
        notas: f.Notas || '', lat: '', lng: '',
        estado: 'Prospecto', proximavisita: ''
      });
      idMap[f.ID] = res.id;
    }

    // 2. Construir paradas con IDs correctos
    const paradas = S.routeOrdered.map(f => ({
      id_ferreteria: f._esNueva ? (idMap[f.ID] || '') : (f._matchedId || f.ID || ''),
      nombre:    f.Nombre,
      direccion: f['Dirección'] || f.Dirección || '',
      localidad: f.Localidad || '',
      telefono:  f['Teléfono'] || '',
      contacto:  f.Contacto || '',
      notas:     f.Notas || '',
      lat:       f.Lat || '',
      lng:       f.Lng || ''
    }));

    // 3. Crear el reparto
    const res = await apiFetch('createReparto', {nombre, fecha, paradas});
    const rid = res.id;

function parsearParaEdit() {
  const txt = document.getElementById('edit-paste-area')?.value?.trim();
  if (!txt) { toast('Pegá las ferreterías primero'); return; }
  const lineas = txt.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lineas.length) { toast('No hay líneas válidas'); return; }

  const paradas = [];
  const matchCounts = {}; // matchedId → [nombres]

  for (let i = 0; i < lineas.length; i++) {
    const idx = lineas[i].indexOf(',');
    if (idx < 0) { toast(`Línea ${i+1} sin coma — saltada`); continue; }
    const nombre = lineas[i].slice(0, idx).trim();
    const dir    = lineas[i].slice(idx + 1).trim();
    const matched = matchFerreteria(nombre);

    if (matched) {
      if (!matchCounts[matched.ID]) matchCounts[matched.ID] = [];
      matchCounts[matched.ID].push(nombre);
      paradas.push({
        ID: matched.ID, Nombre: nombre, 'Dirección': dir,
        Localidad: '', Lat: matched.Lat||'', Lng: matched.Lng||'',
        'Teléfono': matched['Teléfono']||'', Contacto: matched.Contacto||'', Notas: matched.Notas||'',
        _esNueva: false, _matchedId: matched.ID,
        _ultimaVisita: matched.UltimaVisita || matched['UltimaVisita'] || ''
      });
    } else {
      paradas.push({
        ID: 'nueva-' + i, Nombre: nombre, 'Dirección': dir,
        Localidad: '', Lat: '', Lng: '', 'Teléfono': '', Contacto: '', Notas: '',
        _esNueva: true, _matchedId: null, _ultimaVisita: ''
      });
    }
  }

  if (!paradas.length) { toast('No se pudieron parsear las líneas'); return; }

  // Detectar duplicados: misma DB matcheada por dos entradas distintas
  const dupIds = new Set(
    Object.entries(matchCounts).filter(([,nombres]) => nombres.length > 1).map(([id]) => id)
  );

  // También detectar colisión con paradas ya existentes en el reparto
  const enReparto = new Set(S.editReparto.paradas.map(p => p['ID_Ferretería']||p.id_ferreteria||p.ID));

  mostrarPreviewParaEdit(paradas, dupIds, enReparto);
}

function mostrarPreviewParaEdit(paradas, dupIds, enReparto) {
  const html = paradas.map((p, i) => {
    const esDup = dupIds.has(p._matchedId);
    const yaEsta = !p._esNueva && enReparto.has(p.ID);
    const tags = [
      p._esNueva ? `<span style="background:#ede9fe;color:#6d28d9;border-radius:4px;padding:1px 6px;font-size:10px;margin-left:5px">Nueva</span>` : '',
      ultimaVisitaBadge(p._ultimaVisita),
      esDup ? `<span style="background:#fee2e2;color:#991b1b;border-radius:4px;padding:1px 6px;font-size:10px;margin-left:5px">⚠ Posible duplicado</span>` : '',
      yaEsta ? `<span style="background:#f3f4f6;color:#6b7280;border-radius:4px;padding:1px 6px;font-size:10px;margin-left:5px">Ya en reparto</span>` : ''
    ].join('');
    return `
<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
  <input type="checkbox" id="pe-${i}" ${yaEsta?'':'checked'} style="margin-top:3px;flex-shrink:0">
  <div style="flex:1;min-width:0">
    <div style="font-weight:600;font-size:13px;flex-wrap:wrap">${esc(p.Nombre)}${tags}</div>
    <div style="font-size:11px;color:var(--text2)">${esc(p['Dirección'])}</div>
  </div>
</div>`;
  }).join('');

  const hasDups = dupIds.size > 0;
  const dupMsg = hasDups ? `<div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:10px;margin-bottom:12px;font-size:13px">⚠️ <strong>Posibles duplicados detectados.</strong> Revisá las marcadas y desmarcá las repetidas.</div>` : '';

  window._editParadasTemp = paradas;
  modal(`
<div class="modal-title">Confirmar paradas</div>
${dupMsg}
<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Desmarcá las que NO querés agregar</div>
<div style="max-height:320px;overflow-y:auto">${html}</div>

  <button class="btn bp" onclick="confirmarParaEdit()">Agregar seleccionadas</button>
  <button class="btn bgh" onclick="openAddToReparto()">← Volver</button>
</div>`);
}

function confirmarParaEdit() {
  const paradas = window._editParadasTemp || [];
  const enReparto = new Set(S.editReparto.paradas.map(p => p['ID_Ferretería']||p.id_ferreteria||p.ID));
  paradas.forEach((p, i) => {
    const cb = document.getElementById('pe-' + i);
    if (!cb || !cb.checked) return;
    if (!p._esNueva && enReparto.has(p.ID)) { toast(`${p.Nombre} ya está en el reparto`); return; }
    S.editReparto.paradas.push({
      Nombre: p.Nombre, 'Dirección': p['Dirección'], Localidad: '',
      'Teléfono': p['Teléfono']||'', Contacto: p.Contacto||'', Notas: p.Notas||'',
      Lat: p.Lat||'', Lng: p.Lng||'',
      'ID_Ferretería': p._esNueva ? null : p.ID,
      Estado: 'pendiente', _esNueva: p._esNueva

  });

  renderEditModal();
  toast('Paradas agregadas ✓');
}

async function loadReparto(id, savedIdx) {
  if (!id) id = document.getElementById('fid')?.value?.trim();
  if (!id) { toast('Ingresá el ID'); return; }
  S.view = 'loading'; render();
  try {
    const rep = await apiFetch('getReparto', {id});
    if (!rep || !rep.paradas) {
      S.view = 'field-entry'; render();
      localStorage.removeItem('hzn_field_reparto');
      localStorage.removeItem('hzn_field_idx');
      toast('No se encontró el reparto. Revisá el ID.'); return;
    }
    S.reparto = rep;
    if (savedIdx != null && savedIdx >= 0 && savedIdx < rep.paradas.length) {
      S.paradaIdx = savedIdx;
    } else {
      const first = rep.paradas.findIndex(p => p.Estado === 'pendiente');
      S.paradaIdx = first >= 0 ? first : 0;
    }
    localStorage.setItem('hzn_field_reparto', id);
    localStorage.setItem('hzn_field_idx', S.paradaIdx);
    S.view = 'field'; render();
  } catch(e) { S.view = 'field-entry'; render(); toast('Error: ' + e.message); }
}

function salirModoRepartidor() {
  localStorage.removeItem('hzn_field_reparto');
  localStorage.removeItem('hzn_field_idx');
  S.reparto = null; S.paradaIdx = 0; S.view = 'field-entry'; render();
}

function renderField() {
  const rep = S.reparto;
  if (!rep) return renderFieldEntry();
  const ps    = rep.paradas || [];
  const total = ps.length;
  const done  = ps.filter(p => p.Estado !== 'pendiente').length;
  const pct   = total ? Math.round(done/total*100) : 0;

  return `
<div class="fhdr">
  <div class="fhdr-top">
    <button style="background:none;border:none;cursor:pointer;font-size:20px;padding:2px" onclick="salirModoRepartidor()">←</button>
    <div style="flex:1">
      <div class="fhdr-rep">${esc(rep.Nombre)}</div>
      <div class="fhdr-prog">${done}/${total} completadas · ${pct}%</div>
    </div>
    <button class="fhdr-list-btn" onclick="S.fieldTab=S.fieldTab==='parada'?'lista':'parada';render()">
      ${S.fieldTab === 'parada' ? '📋 Lista' : '📍 Parada'}
    </button>
  </div>
  <div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>
</div>
<div class="content" style="padding-top:12px">
  ${S.fieldTab === 'parada' ? renderParada(ps) : renderStopList(ps)}
</div>`; }

function renderParada(ps) {
  const par = ps[S.paradaIdx];
  if (!par) return `
<div class="par-card" style="text-align:center;padding:40px 20px">
  <div style="font-size:52px;margin-bottom:12px">🎉</div>
  <div style="font-size:22px;font-weight:800;margin-bottom:8px">¡Ruta completada!</div>
  <div style="font-size:15px;color:var(--text2);margin-bottom:24px">Todas las paradas fueron visitadas</div>
  <button class="btn bp" onclick="verResumen()">Ver resumen del día</button>
</div>`;

  const isEnt  = par.Estado === 'entregado';
  const isNC   = par.Estado === 'sin-contacto';
  const isDone = isEnt || isNC;

  const lat    = par.Lat||par.lat||'';
  const lng    = par.Lng||par.lng||'';
  const dir    = `${par['Dirección']||par.Dirección||par.direccion||''}, ${par.Localidad||par.localidad||''}, Buenos Aires, Argentina`;
  const wazeUrl= lat&&lng ? `https://ul.waze.com/ul?ll=${lat},${lng}&navigate=yes&zoom=17`
                           : `https://ul.waze.com/ul?q=${encodeURIComponent(dir)}&navigate=yes`;
  const mapsUrl= lat&&lng ? `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`
                           : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dir)}&travelmode=driving`;
  const tel      = par['Teléfono']||par.telefono||'';
  const contacto = par.Contacto||par.contacto||'';
  const notas    = par.Notas||par.notas||'';

  return `
<div class="par-card">
  <div class="par-num">Parada ${S.paradaIdx+1} de ${ps.length}</div>
  <div class="par-nombre">${esc(par.Nombre||par.nombre||'')}</div>
  <div class="par-dir">📍 ${esc(par['Dirección']||par.Dirección||par.direccion||'')} · ${esc(par.Localidad||par.localidad||'')}</div>
  ${tel ? `<a href="tel:${esc(tel)}" style="text-decoration:none"><div class="par-tel">📞 ${esc(tel)}</div></a>` : ''}
  ${contacto ? `<div style="font-size:14px;color:var(--text2);margin-bottom:10px">👤 ${esc(contacto)}</div>` : ''}
  ${notas ? `<div class="par-notas-prev">💡 ${esc(notas)}</div>` : ''}

  ${isDone ? `<div class="par-done-banner" style="background:${isEnt?'#D1FAE5':'#FEE2E2'};color:${isEnt?'#065F46':'#991B1B'}">
    ${isEnt ? '✅ Entregado' : '❌ Sin contacto'}
  </div>` : ''}

  <div style="display:flex;gap:8px;margin-bottom:0">
    <a href="${wazeUrl}" target="_blank" style="flex:1;text-decoration:none">
      <button class="btn bp" style="font-size:14px">🗺 Abrir Waze</button>
    </a>
    <a href="${mapsUrl}" target="_blank" style="flex:1;text-decoration:none">
      <button class="btn bgh" style="font-size:14px">📍 Maps</button>
    </a>
  </div>
</div>

<div class="card">
  <div class="fld" style="margin-bottom:12px">
    <label>Momentario / Comentario</label>
    <textarea id="nota" placeholder="Dejá una nota..." rows="2">${esc(par.Nota||'')}</textarea>
  </div>
  ${!isDone ? `
  <button class="btn bg2" style="margin-bottom:8px" onclick="marcar('entregado')">✅ Entregado</button>
  <button class="btn br" style="margin-bottom:8px" onclick="marcar('sin-contacto')">❌ No estaba / Sin contacto</button>
  ` : `<button class="btn bgh" style="margin-bottom:8px" onclick="marcar('pendiente')">↩ Deshacer</button>`}
  ${S.paradaIdx < ps.length-1
    ? `<button class="btn bo" onclick="irA(${S.paradaIdx+1})">Siguiente → <span style="font-weight:400;font-size:13px">${esc(ps[S.paradaIdx+1]?.Nombre||'')}</span></button>`
    : `<button class="btn bo" onclick="verResumen()">Ver resumen del día 📊</button>`}
</div>
${S.paradaIdx > 0 ? `<button style="background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;display:block;margin:0 auto;padding:8px" onclick="irA(${S.paradaIdx-1})">← Parada anterior</button>` : ''}`; }

function renderStopList(ps) { return `
<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px">TODAS LAS PARADAS</div>
${ps.map((p,i) => {
  const isEnt = p.Estado === 'entregado';
  const isNC  = p.Estado === 'sin-contacto';
  const isCur = i === S.paradaIdx;
  return `
<div class="sl-item ${isEnt?'done':isNC?'nocon':''} ${isCur?'current':''}"
  onclick="irA(${i});S.fieldTab='parada';render()">
  <div class="sl-num">${isEnt?'✓':isNC?'✗':i+1}</div>
  <div style="flex:1;min-width:0">
    <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.Nombre||p.nombre||'')}</div>
    <div style="font-size:12px;color:var(--text2)">${esc(p['Dirección']||p.Dirección||p.direccion||'')} · ${esc(p.Localidad||p.localidad||'')}</div>
  </div>
  ${p.Nota ? '<span style="font-size:16px">💬</span>' : ''}
  ${isCur  ? '<span style="font-size:14px;color:var(--blue)">●</span>' : ''}
</div>`; }).join('')}`; }

async function marcar(estado) {
  const par  = S.reparto.paradas[S.paradaIdx];
  const nota = document.getElementById('nota')?.value || '';
  par.Estado = estado; par.Nota = nota;
  render();
  try {
    await apiFetch('updateParada', {id: par.ID, estado, nota});
    if (estado === 'entregado') {
      const nxt = S.reparto.paradas.findIndex((p,i) => i > S.paradaIdx && p.Estado === 'pendiente');
      if (nxt >= 0) setTimeout(() => irA(nxt), 450);
    }
  } catch(e) { toast('No se pudo guardar. Reintentá más tarde.'); }
}

function irA(idx) {
  const nota = document.getElementById('nota');
  if (nota && S.reparto?.paradas[S.paradaIdx]) S.reparto.paradas[S.paradaIdx].Nota = nota.value;
  S.paradaIdx = idx;
  localStorage.setItem('hzn_field_idx', idx);
  render(); window.scrollTo(0, 0);
}

function verResumen() {
  const ps  = S.reparto?.paradas || [];
  const ent = ps.filter(p => p.Estado === 'entregado');
  const nc  = ps.filter(p => p.Estado === 'sin-contacto');
  const pen = ps.filter(p => p.Estado === 'pendiente');
  modal(`
<div class="modal-title">📊 Resumen del reparto</div>
<div style="display:flex;gap:8px;margin-bottom:16px;text-align:center">
  <div style="flex:1;background:#D1FAE5;border-radius:12px;padding:16px">
    <div style="font-size:32px;font-weight:800;color:#16A34A">${ent.length}</div>
    <div style="font-size:12px;color:#15803D;font-weight:600">ENTREGADAS</div>
  </div>
  <div style="flex:1;background:#FEE2E2;border-radius:12px;padding:16px">
    <div style="font-size:32px;font-weight:800;color:#DC2626">${nc.length}</div>
    <div style="font-size:12px;color:#B91C1C;font-weight:600">SIN CONTACTO</div>
  </div>
  <div style="flex:1;background:var(--bg);border-radius:12px;padding:16px">
    <div style="font-size:32px;font-weight:800">${pen.length}</div>
    <div style="font-size:11px;color:var(--text2);font-weight:600">PENDIENTES</div>
  </div>
</div>
${nc.length ? `<div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px">Sin contacto:</div>
${nc.map(p => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">❌ ${esc(p.Nombre||p.nombre||'')}${p.Nota?` · <em style="color:var(--text2)">${esc(p.Nota)}</em>`:''}</div>`).join('')}` : ''}
${pen.length ? `<div style="font-size:13px;font-weight:700;color:var(--text2);margin:12px 0 8px">Pendientes:</div>
${pen.map(p => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">⏳ ${esc(p.Nombre||p.nombre||'')}</div>`).join('')}` : ''}
<button class="btn bg2" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`); }

// ════════════════════════════════════════════════════════
// DATA LOADING
// ════════════════════════════════════════════════════════
async function loadFerreterias() { S.ferreterias = await apiFetch('getFerreterias'); }
async function loadRepartos()    { S.repartos    = await apiFetch('getRepartos'); }

async function loadApp() {
  if (!S.scriptUrl) { S.view = 'setup'; render(); return; }
  S.view = 'loading'; render();
  try {
    await Promise.all([loadFerreterias(), loadRepartos(), loadDashboardStats()]);
    S.view = 'admin'; render();
  } catch(e) {
    S.view = 'admin'; S.ferreterias = []; S.repartos = []; render();
    toast('Error al conectar: ' + e.message, 6000);
  }
}

// ── INIT ──────────────────────────────────────────────────
const qp = new URLSearchParams(window.location.search);
if (qp.get('reparto')) {
  S.view = 'field-entry'; render();
  setTimeout(() => {
    const el = document.getElementById('fid');
    if (el) { el.value = qp.get('reparto'); loadReparto(); }
  }, 100);
} else {
  const _savedRep = localStorage.getItem('hzn_field_reparto');
  const _savedIdx = parseInt(localStorage.getItem('hzn_field_idx') || '0', 10);
  if (_savedRep) {
    loadReparto(_savedRep, _savedIdx);
  } else {
    loadApp();
  }
}
</script>
</body>
</html>
